name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: pages
        uses: actions/configure-pages@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install shfmt
        run: |
          curl -sSfL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
      - name: Format shell scripts
        run: shfmt -i 2 -ci -sr -w scripts/
      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/lxc/*.sh scripts/addon/*.sh scripts/pve/*.sh scripts/vm/*.sh
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: tools/ast/go.sum
      - name: Generate AST files
        run: go run -C tools/ast .
      - name: Install image processor
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin
          gem install mini_magick
      - name: Download logos
        run: ruby .github/scripts/fetch-logos.rb
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: production
      - name: Commit generated artifacts
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts.json _ast/ assets/logos/ _lxc/ _addon/ _pve/ _vm/ scripts/
          if ! git diff --cached \
              -I '"generated_at":' \
              -I '"updated_at":' \
              -I '"created_at":' \
              --quiet; then
            git commit -m "chore(ci): update generated artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
