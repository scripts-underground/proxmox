<script>
(function(){
    var FLAG_COLORS = {
        sudo:'240,130,20', git:'40,100,220', host:'220,50,40',
        docker:'50,120,210', podman:'60,150,195',
        external:'200,140,50', eval:'180,40,45',
        npm:'40,150,160', yarn:'60,170,130', pnpm:'30,130,180',
        pip:'140,55,185', cargo:'180,100,40', go:'0,173,216'
    };
    var FLAGS = ["docker","podman","external","git","sudo","eval","npm","yarn","pnpm","pip","cargo","go"];

    window.renderFlagPills = function(s) {
        if (!s) return '';
        var out = [];
        for (var i = 0; i < FLAGS.length; i++) {
            if (s['has_' + FLAGS[i]]) {
                var c = FLAG_COLORS[FLAGS[i]];
                out.push('<span class="flag-pill" style="--flag-color:rgb(' + c + ');--flag-bg:rgba(' + c + ',0.25);--flag-bdr:rgba(' + c + ',0.6)">' + FLAGS[i] + '</span>');
            }
        }
        if (s.has_global && s.type === 'lxc') {
            var c = FLAG_COLORS.host;
            out.push('<span class="flag-pill" style="--flag-color:rgb(' + c + ');--flag-bg:rgba(' + c + ',0.25);--flag-bdr:rgba(' + c + ',0.6)">host</span>');
        }
        return out.join('');
    };
})();
</script>
